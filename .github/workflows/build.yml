name: Build & Release Installer

on:
  workflow_dispatch:            # 手动触发（可在任意分支上验证）
  push:
    tags:
      - 'v*'                    # 推送 v 开头标签时自动构建并发布

permissions:
  contents: write               # 允许上传 Release

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false          # 一个平台失败不阻塞其他平台
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11
        run: |
          npm install -g pnpm@11
          pnpm --version

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Windows 长路径支持（依赖树嵌套深，打包路径可能超 260 字符）
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true

      - name: Clone & build DeepSeek Harness
        run: node build/build-harness.js

      - name: Materialize node_modules links
        run: node build/materialize3.js resources/harness

      - name: Trim + web-frontend
        run: node build/trim.js

      - name: Install app dependencies (electron)
        run: npm install

      - name: Generate app icon
        run: node build/convert-icon.js log.svg build/app.ico

      - name: Download rcedit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile "build\rcedit-x64.exe"

      - name: Download bundled Node runtime
        run: node build/download-node.js v24.14.0

      - name: Assemble desktop app
        run: node build/assemble.js

      # 释放源 harness/node 目录（产物内已含副本），缓解 14GB 磁盘上限
      # 用 Node 跨平台删除（Windows PowerShell 的 rm -rf 不兼容）
      - name: Free source resources (post-assemble)
        run: node -e "const fs=require('fs');for(const d of ['resources/harness','resources/node']){fs.rmSync(d,{recursive:true,force:true});console.log('freed',d)}"

      # ---------- 冒烟测试：验证产物可运行（防上游漂移/pnpm 错配导致的"全绿但运行时坏"） ----------
      - name: Smoke test assembled app
        run: node build/smoke-test.js --app build/DeepSeekHarnessApp --port 3081

      # ---------- QQ 桥端到端：mock OneBot + mock LLM，验证注入插件在产物中可用 ----------
      - name: QQ bridge E2E smoke
        run: node build/smoke-test.js --app build/DeepSeekHarnessApp --port 3081 --qq-e2e

      # ---------- Windows: Inno Setup 安装包 ----------
      - name: Compile installer (ISCC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { 'dev' }
          if (-not $ver) { $ver = "0.1.0" }
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          & $iscc "/DProjectDir=$((Get-Location).Path)" "/DMyAppVersion=$ver" setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed, exit $LASTEXITCODE" }

      # ---------- macOS: .app + .dmg ----------
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VER="$( [ "$GITHUB_REF_TYPE" = "tag" ] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0-dev )"
          ARCH="$(node -p "process.arch")"
          mkdir -p installers
          hdiutil create -volname "DeepSeek Harness" \
            -srcfolder "build/DeepSeekHarnessApp/DeepSeekHarness.app" \
            -ov -format UDZO "installers/DeepSeekHarness-macOS-${ARCH}-${VER}.dmg"

      # ---------- Linux: .tar.gz + .deb ----------
      - name: Package tarball (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VER="$( [ "$GITHUB_REF_TYPE" = "tag" ] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0-dev )"
          ARCH="$(node -p "process.arch")"
          mkdir -p installers
          # assemble.js 在 Linux 将应用输出到 DeepSeekHarnessApp 根目录
          tar -C build/DeepSeekHarnessApp -czf "installers/DeepSeekHarness-linux-${ARCH}-${VER}.tar.gz" .

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # dpkg-deb 要求版本号以数字开头
          VER="$( [ "$GITHUB_REF_TYPE" = "tag" ] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0-dev )"
          ARCH="$(node -p "process.arch === 'arm64' ? 'arm64' : 'amd64'")"
          APP=deepseek-harness
          PKG="installers/pkg"
          rm -rf "$PKG"
          mkdir -p "$PKG/usr/lib/$APP" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps" "$PKG/DEBIAN"
          # 硬链接 staging（cp -al）：零额外磁盘，避免 14GB 上限下 ENOSPC
          cp -al build/DeepSeekHarnessApp/. "$PKG/usr/lib/$APP/"
          cp build/icon-256.png "$PKG/usr/share/icons/hicolor/256x256/apps/deepseek-harness.png"
          cat > "$PKG/usr/share/applications/$APP.desktop" <<'EOF'
          [Desktop Entry]
          Name=DeepSeek Harness
          Comment=DeepSeek Harness desktop launcher
          Exec=/usr/lib/deepseek-harness/DeepSeekHarness
          Icon=deepseek-harness
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          StartupWMClass=DeepSeek Harness
          EOF
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: deepseek-harness
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: $ARCH
          Maintainer: DeepSeek AI
          Description: DeepSeek Harness desktop launcher (Electron + bundled Node runtime)
          Depends: libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libasound2 | libasound2t64
          EOF
          printf '#!/bin/sh\nset -e\nln -sf /usr/lib/deepseek-harness/DeepSeekHarness /usr/bin/deepseek-harness\n' > "$PKG/DEBIAN/postinst"
          chmod +x "$PKG/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$PKG" "installers/${APP}_${VER}_${ARCH}.deb"
          rm -rf "$PKG"

      # ---------- 上传安装包到 Actions artifacts（release 作业统一发布，避免三平台并行写同 Release 竞态） ----------
      - name: Upload installer artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: installers/
          if-no-files-found: error
          retention-days: 1

  # 单一发布作业：等三平台构建全部完成后，统一上传 Release（消除并发写同一 tag 的竞态失败）
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
